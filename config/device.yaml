# Paul Novus 300/450 — unit-specific configuration.
#
# This file holds information about YOUR specific unit. It's the only file
# a user normally needs to edit. The register/protocol map lives alongside
# in `registers.yaml` and is not meant to be changed.
#
# For the bus protocol itself (command codes, frame format, quirks) see
# `BACKGROUND.md`.

device:
  name: Paul Novus 300
  manufacturer: Paul Novus
  model: NOVUS300
  variant: left          # "left" or "right" — affects T1-T4 sensor mapping
  hw_version: L-VER-DEF
  sw_version: 1.7.1
  serial_number: 000741929834
  suggested_area: Technical Room
  # This unit's probes don't follow the manufacturer's left-hand table
  # (T3 extract, T4 exhaust): recorder history shows T3 tracks the outdoor
  # temperature and T4 the room temperature (checked 2026-10-24 and 2026-11-14).
  temperature_sensors:
    t1: intake
    t2: supply
    t3: exhaust
    t4: extract
