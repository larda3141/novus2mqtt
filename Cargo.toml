[package]
name = "novus2mqtt"
version = "2025.4.14"
edition = "2021"
description = "MQTT bridge for Paul Novus HVAC systems with Home Assistant integration"
license = "MIT"
repository = "https://github.com/larda3141/novus2mqtt"
keywords = ["mqtt", "home-assistant", "ventilation", "paul-novus", "hvac"]

[[bin]]
name = "novus2mqtt"
path = "src/main.rs"

[dependencies]
# Async runtime — only the features actually used in src/.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util"] }

# Serial port
tokio-serial = "5"

# MQTT
rumqttc = "0.24"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml_ng is the actively-maintained drop-in replacement for the
# unmaintained `serde_yaml` (RUSTSEC-2024-0320). Same module path, same API.
serde_yaml_ng = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
humantime = "2"

# System metrics
sysinfo = "0.32"

# File locking
fd-lock = "4"

# Hashing (device ID)
blake2 = "0.10"

# Error handling
anyhow = "1"

# Low-level
libc = "0.2"
dotenvy = "0.15"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
